name: Offline CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.12.13-slim-bookworm
      options: --cpus 2 --memory 2g --pids-limit 256
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GUAVA_DISABLE_TELEMETRY: "true"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run pytest -q -rs
